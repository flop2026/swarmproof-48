name: Public dead-man monitor

on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swarmproof-public-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: github.repository == 'flop2026/swarmproof-48'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Use pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Verify public liveness evidence
        run: npm run monitor:remote
