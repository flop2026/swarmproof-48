name: Public dead-man monitor

on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swarmproof-public-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: github.repository == 'flop2026/swarmproof-48'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false
      - name: Use pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Verify public liveness evidence
        run: npm run monitor:remote
