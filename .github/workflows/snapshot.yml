name: Daily evidence snapshot

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "7 */6 * * *"
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: swarmproof-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.repository_owner == 'flop2026'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: UTC
      SWARMPROOF_RETAIN_SKETCHES: "0"
      SWARMPROOF_EVENT_NAME: ${{ github.event_name }}
      SWARMPROOF_SCHEDULE: ${{ github.event.schedule }}
    steps:
      - name: Check out trusted branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - name: Configure pseudonymous commit identity
        shell: bash
        run: |
          git config user.name "SwarmProof Coordinator"
          git config user.email "${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com"
          git config user.useConfigOnly true
      - name: Inspect elapsed event window
        id: lifecycle
        shell: bash
        run: |
          lifecycle=$(node scripts/finalize.mjs --check)
          if [[ "$lifecycle" == *'"action":"final_drain_required"'* ]]; then
            echo "finalize_due=1" >> "$GITHUB_OUTPUT"
          else
            echo "finalize_due=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Select bounded cadence
        id: cadence
        shell: bash
        run: |
          state=$(node -p "JSON.parse(require('fs').readFileSync('config/event.json','utf8')).state")
          run_snapshot=0
          network=0
          if [ "${{ steps.lifecycle.outputs.finalize_due }}" = "1" ]; then
            run_snapshot=1
            network=1
          elif [ "$SWARMPROOF_EVENT_NAME" = "workflow_dispatch" ]; then
            run_snapshot=1
            network=1
          elif [ "$SWARMPROOF_SCHEDULE" = "*/15 * * * *" ] && [ "$state" = "active" ]; then
            run_snapshot=1
          elif [ "$SWARMPROOF_SCHEDULE" = "7 */6 * * *" ] && [ "$state" = "active" ]; then
            run_snapshot=1
            network=1
          elif [ "$SWARMPROOF_SCHEDULE" = "17 0 * * *" ] && [ "$state" != "active" ]; then
            run_snapshot=1
            network=1
          fi
          echo "run_snapshot=$run_snapshot" >> "$GITHUB_OUTPUT"
          echo "network=$network" >> "$GITHUB_OUTPUT"
      - name: Use pinned Node.js
        if: steps.cadence.outputs.run_snapshot == '1'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        if: steps.cadence.outputs.run_snapshot == '1'
        run: npm ci --ignore-scripts
      - name: Generate bounded snapshot
        if: steps.cadence.outputs.run_snapshot == '1'
        env:
          SWARMPROOF_NETWORK: ${{ steps.cadence.outputs.network }}
        shell: bash
        run: |
          snapshot=$(node scripts/snapshot.mjs)
          echo "$snapshot"
          if [ "${{ steps.lifecycle.outputs.finalize_due }}" = "1" ] && [[ "$snapshot" != *'"action":"final_drain"'* ]]; then
            exit 1
          fi
      - name: Validate generated output
        if: steps.cadence.outputs.run_snapshot == '1'
        run: npm run validate
      - name: Finalize drained snapshot transactionally
        if: steps.lifecycle.outputs.finalize_due == '1'
        run: node scripts/finalize.mjs
      - name: Validate finalized output
        if: steps.lifecycle.outputs.finalize_due == '1'
        run: npm run validate && npm run verify:report
      - name: Commit and publish snapshot update
        if: steps.cadence.outputs.run_snapshot == '1'
        shell: bash
        run: |
          unexpected=$(git status --porcelain | awk '$2 != "config/event.json" && $2 !~ /^public\/data\// { print $2 }')
          if [ -n "$unexpected" ]; then
            exit 1
          fi
          changed=$(git status --porcelain -- config/event.json public/data)
          if [ -z "$changed" ]; then
            exit 0
          fi
          git add config/event.json public/data
          if [ "${{ steps.lifecycle.outputs.finalize_due }}" = "1" ]; then
            git commit -m "event: freeze final evidence snapshot"
          else
            git commit -m "data: daily evidence snapshot"
          fi
          git push origin HEAD:main
      - name: Verify the exact snapshot reached Cloudflare Pages
        if: steps.cadence.outputs.run_snapshot == '1'
        run: node scripts/verify-deployment.mjs
